services:  
    postgres:
      image: postgres:18-bookworm
      environment:
        POSTGRES_PASSWORD: ${CONN_PASSWORD}
        POSTGRES_DB: ${POSTGRES_DB}
      ports:
        - "5432:5432"
      volumes:
        - employees_pgdata:/var/lib/postgresql
      healthcheck:
        test: ["CMD", "pg_isready", "-U", "postgres"]
        interval: 5s
        retries: 10
    app:
      build: .
      ports:
        - "8080:8080"
      environment:
        CONN_STRING: postgres://postgres:${CONN_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      depends_on:
        postgres:
          condition: service_healthy

volumes:
 employees_pgdata:
     
